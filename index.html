<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<title>わが家の食材手帳</title>
<meta name="description" content="冷蔵庫の在庫と期限を家族で共有できる手帳アプリ。買い物も「家族みんなでできる食育」も楽しめます。フレンドコードで同じ冷蔵庫をシェア。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS: ホーム画面から起動したときネイティブアプリらしく見せる -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食材手帳">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- iOS: 起動スプラッシュ（採用アイコンをベージュ背景の中央に配置） -->
<link rel="apple-touch-startup-image" href="splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="stylesheet" href="styles.css">
<style>
/* 起動時のクリティカルスタイル: styles.css が届く前（初回表示・回線が遅い時）
   からベージュ背景で描き、白フラッシュや無地の素のHTMLが一瞬見えるのを防ぐ。
   ここは「最初の1フレーム」のためだけの最小限で、見た目は styles.css と揃える。 */
html, body { background: #faf6ef; }
body {
  margin: 0; color: #4a3b2c;
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
}
.app-header { background: #faf6ef; padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 8px; }
.brand { display: flex; gap: 12px; align-items: center; max-width: 640px; margin: 0 auto; }
.brand h1 { margin: 0; font-size: 20px; }
.brand p { margin: 3px 0 0; font-size: 12px; color: #8a7663; }
.app-main { max-width: 640px; margin: 0 auto; padding: 12px 14px 122px; }
.loading { text-align: center; color: #8a7663; padding: 40px 0; }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <button id="menu-btn" class="menu-btn" type="button" aria-label="メニューを開く" hidden>☰</button>
    <img src="icon-192.png" alt="" class="brand-icon" width="34" height="34">
    <div>
      <h1>わが家の食材手帳</h1>
      <p id="header-sub">冷蔵庫の在庫と期限を、家族みんなで。食育もいっしょに</p>
    </div>
    <button id="update-btn" class="menu-btn update-btn" type="button" aria-label="アプリを最新に更新" title="アプリを最新に更新">🔄</button>
  </div>
</header>

<div id="demo-banner" class="demo-banner" hidden>
  🧪 デモモード：データはこの端末の中だけに保存されます（外部には送信されません）。
  本番公開には Firebase の設定が必要です（README を参照）。
</div>
<div id="join-banner" class="join-banner" hidden></div>

<div id="offline-banner" class="offline-banner" hidden>
  <span class="offline-chip">📴 オフライン表示中</span>
  <span class="offline-note">前回開いたときの内容を表示しています。登録・変更は端末に保存され、つながると自動で同期します</span>
</div>

<main id="app" class="app-main">
  <p class="loading">読み込み中…</p>
</main>

<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
